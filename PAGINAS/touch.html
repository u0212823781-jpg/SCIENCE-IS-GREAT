<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Touch – Super Hands</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--red:#ef3d45;--yellow:#ffd52a;--blue:#3488e8;--navy:#1565c0;--orange:#f28b24;--green:#35b64a;--purple:#8d55c7;--pink:#ff6fa3;--ink:#202020;--vh:1vh}
@supports(height:1dvh){:root{--vh:1dvh}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:Fredoka,"Arial Rounded MT Bold",Arial,sans-serif;color:var(--ink);background:#f5f0ff;-webkit-tap-highlight-color:transparent;user-select:none;overflow-x:hidden}
button{font-family:inherit;color:inherit;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
img{-webkit-user-drag:none}
.bubbles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bubble{position:absolute;bottom:-120px;border-radius:50%;opacity:.14;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(calc(-120*var(--vh) - 200px))}}
.top{position:relative;z-index:3;display:flex;align-items:center;gap:12px;padding:12px 14px 0}
.pill{background:#fff;border-radius:50px;padding:10px 20px;font-size:clamp(18px,2.6vh,24px);font-weight:700;text-decoration:none;color:var(--ink);box-shadow:0 4px 14px #0002;white-space:nowrap}
.pill:active{transform:scale(.95)}
.top h1{flex:1;text-align:center;margin:0;font-size:clamp(34px,calc(8*var(--vh)),72px);line-height:1}
h1 span{display:inline-block;-webkit-text-stroke:3px #fff;paint-order:stroke;text-shadow:0 4px 0 #0001}
h1 span:nth-child(6n+1){color:var(--red)}h1 span:nth-child(6n+2){color:var(--orange)}h1 span:nth-child(6n+3){color:var(--yellow)}
h1 span:nth-child(6n+4){color:var(--green)}h1 span:nth-child(6n+5){color:var(--blue)}h1 span:nth-child(6n+6){color:var(--purple)}
h1 .sp{width:.3em}
.spacer{width:110px}
.hidden{display:none!important}
section{position:relative;z-index:1}
.lead{text-align:center;font-size:clamp(20px,calc(3.8*var(--vh)),32px);color:#557;margin:calc(1.2*var(--vh)) 10px calc(1.6*var(--vh))}

.menu{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(14px,2.4vw,32px);padding:calc(2*var(--vh)) 3vw calc(4*var(--vh))}
.mcard{width:clamp(160px,19vw,250px);background:#fff;border-radius:30px;box-shadow:0 8px 24px #0002;border:6px solid #fff;padding:0 0 12px;display:flex;flex-direction:column;align-items:center;transition:transform .2s}
.mcard:hover{transform:translateY(-6px) rotate(-1deg)}
.mcard:active{transform:scale(.96)}
.mcard .ic{width:100%;aspect-ratio:1.1;border-radius:24px;display:grid;place-items:center;font-size:clamp(58px,7vw,98px)}
.mcard .ic{min-height:0;overflow:hidden;position:relative}
.mcard .ic img{position:absolute;inset:12%;width:76%;height:76%;object-fit:contain;filter:drop-shadow(0 4px 6px #0002)}
.obtn .e img{height:1.05em;width:auto;max-width:100%;object-fit:contain;display:block;margin:0 auto}
.panel .wd .face img{height:1.1em;width:auto;vertical-align:middle}
.mcard .t{font-size:clamp(20px,2.2vw,29px);font-weight:700;margin-top:8px;text-align:center;line-height:1.1}
.mcard .d{font-size:clamp(14px,1.3vw,18px);color:#778;text-align:center;padding:2px 8px 0}

.btns{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:calc(1.5*var(--vh)) 0}
.big{border-radius:50px;padding:12px 26px;font-size:clamp(18px,calc(3.3*var(--vh)),28px);font-weight:700;color:#fff;box-shadow:0 6px 0 #0003;transition:transform .1s}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #0003}
.big.blue{background:var(--blue)}.big.pink{background:var(--pink)}.big.green{background:var(--green)}.big.orange{background:var(--orange)}.big.purple{background:var(--purple)}
.big[disabled]{opacity:.35;pointer-events:none}

/* how do I feel */
.storybox{display:flex;justify-content:center;padding:0 3vw;margin-top:calc(1.5*var(--vh))}
#story{width:min(94vw,calc(118*var(--vh)));height:auto;background:#fff;border-radius:30px;box-shadow:0 8px 24px #0002;display:block}
#story text.em{text-anchor:middle;dominant-baseline:central}
#handG{transition:transform .8s cubic-bezier(.4,1.3,.5,1)}
#brainImg{opacity:0;transition:opacity .5s}
#story.up #brainImg,#story.bubOn #brainImg{opacity:.95}
#tipGlow{opacity:0}
#story .nerve{fill:none;stroke:#ffd52a;stroke-width:9;stroke-linecap:round;stroke-dasharray:3 18;opacity:0;transition:opacity .4s}
#story.up .nerve.upN{opacity:1;animation:marchUp .7s linear infinite}
#story.down .nerve.downN{opacity:1;stroke:#ff6fa3;animation:marchDown .7s linear infinite}
@keyframes marchUp{to{stroke-dashoffset:-42}}
@keyframes marchDown{to{stroke-dashoffset:42}}
#zoomBub{opacity:0;transform:scale(.3);transform-box:fill-box;transform-origin:bottom right;transition:all .5s cubic-bezier(.3,1.6,.5,1)}
#story.sensors #zoomBub{opacity:1;transform:scale(1)}
#sensorDots circle{animation:blink 1s ease-in-out infinite}
#sensorDots circle:nth-child(2n){animation-delay:.35s}#sensorDots circle:nth-child(3n){animation-delay:.7s}
@keyframes blink{50%{fill:#ffd52a;r:11}}
#tipGlow{opacity:0;transition:opacity .4s}
#story.sensors #tipGlow,#story.up #tipGlow{opacity:1}
#bub,#bub2{opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:bottom right;transition:all .45s cubic-bezier(.3,1.6,.5,1)}
#story.bubOn #bub{opacity:1;transform:scale(1)}
#story.bub2On #bub2{opacity:1;transform:scale(1)}
.steptext{text-align:center;font-size:clamp(22px,calc(4.4*var(--vh)),38px);font-weight:700;min-height:2.4em;margin:calc(1.4*var(--vh)) 16px 0;line-height:1.2}
.dots{display:flex;justify-content:center;gap:8px;margin-top:6px}
.dots i{width:14px;height:14px;border-radius:50%;background:#dcd3ee}.dots i.on{background:var(--purple)}

/* touch cards (blue, like the flashcards) */
.cards{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(10px,1.8vw,24px);padding:0 3vw calc(4*var(--vh))}
.tcard{width:clamp(130px,14.5vw,190px);aspect-ratio:.74;background:#fff;border:5px solid var(--navy);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 6px 16px #0002;transition:transform .2s;padding:0}
.tcard:hover{transform:translateY(-5px) rotate(-1.5deg)}
.tcard .hd{background:var(--navy);color:#fff;font-size:clamp(12px,1.15vw,16px);font-weight:700;padding:6px 4px}
.tcard .im{flex:1;min-height:0;display:flex;justify-content:center;align-items:center;padding:8px;overflow:hidden}
.tcard .im img{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px}
.tcard .wd{font-size:clamp(22px,2.4vw,32px);font-weight:700;color:var(--navy);padding-bottom:8px;min-height:1.5em}
.stage{position:fixed;inset:0;z-index:20;background:#16204acc;display:flex;align-items:center;justify-content:center;padding:16px}
.panel{position:relative;background:#fff;border:8px solid var(--navy);border-radius:36px;width:min(94vw,640px);max-height:96%;text-align:center;box-shadow:0 20px 50px #0005;animation:pop .35s cubic-bezier(.3,1.6,.5,1);overflow:hidden}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.panel .hd{background:var(--navy);color:#fff;font-size:clamp(22px,calc(4.4*var(--vh)),34px);font-weight:700;padding:10px}
.panel .im{height:calc(36*var(--vh));display:flex;justify-content:center;align-items:center;padding:12px;overflow:hidden}
.panel .im img{height:100%;width:auto;max-width:85%;object-fit:contain;border-radius:16px}
.panel .wd{font-size:clamp(40px,calc(9*var(--vh)),76px);font-weight:700;color:var(--navy);min-height:1.3em;line-height:1.2}
.panel .wd .face{font-size:.8em}
.close{position:absolute;top:8px;right:10px;width:50px;height:50px;border-radius:50%;background:#fff;font-size:26px;font-weight:700;color:var(--navy)}
.panel .nav{display:flex;justify-content:center;gap:12px;padding:6px 10px calc(2*var(--vh))}

/* feely bag */
.bagwrap{display:flex;align-items:center;justify-content:center;gap:clamp(16px,4vw,50px);flex-wrap:wrap;padding:0 3vw}
.bag{position:relative;width:clamp(170px,calc(34*var(--vh)),270px);aspect-ratio:.9}
.bag svg{width:100%;height:100%;overflow:visible}
.bag{aspect-ratio:1.38!important;width:clamp(220px,calc(46*var(--vh)),380px)!important;background:none;padding:0}
.bag img{width:100%;height:100%;object-fit:cover;border-radius:26px;box-shadow:0 8px 20px #0003;border:6px solid #fff;display:block}
.bag.feel{animation:rummage .5s ease-in-out 3}
@keyframes rummage{25%{transform:rotate(-5deg) scale(1.03)}75%{transform:rotate(5deg) scale(1.03)}}
.clue{max-width:440px;text-align:center}
.clue .q{font-size:clamp(20px,calc(3.6*var(--vh)),30px);color:#778}
.clue .c{font-size:clamp(28px,calc(5.6*var(--vh)),48px);font-weight:700;color:var(--purple);line-height:1.15;margin:6px 0}
.opts{display:flex;gap:clamp(12px,2vw,26px);flex-wrap:wrap;justify-content:center;margin-top:calc(2*var(--vh))}
.opt{width:clamp(120px,14vw,190px);background:#fff;border-radius:28px;box-shadow:0 8px 20px #0002;border:6px solid #fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 6px;transition:transform .15s}
.opt .e{font-size:clamp(56px,6.5vw,92px);line-height:1.1;height:1.15em;display:grid;place-items:center}
.opt .e img{height:1.1em;width:auto;max-width:100%;border-radius:12px}
.opt .l{font-size:clamp(17px,1.8vw,24px);font-weight:700;margin-top:6px;text-align:center}
.opt:hover{transform:translateY(-4px)}
.opt.right{border-color:var(--green);background:#e9fbe9;animation:bounce .6s}
.opt.wrong{border-color:var(--red);background:#ffecec;animation:no .4s;opacity:.55}
@keyframes bounce{30%{transform:scale(1.12)}60%{transform:scale(.95)}}
@keyframes no{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}

/* opposites */
.oppq{text-align:center;font-size:clamp(26px,calc(5*var(--vh)),42px);font-weight:700;color:var(--purple);margin-bottom:calc(1*var(--vh))}
.lq{display:flex;align-items:center;justify-content:center;gap:clamp(16px,4vw,60px);flex-wrap:wrap;padding:0 3vw}
.item{width:clamp(140px,calc(28*var(--vh)),220px);height:clamp(140px,calc(28*var(--vh)),220px);background:#fff;border-radius:50%;box-shadow:0 8px 20px #0002;display:grid;place-items:center;font-size:clamp(76px,calc(15*var(--vh)),130px);overflow:hidden}
.item img{width:78%;height:78%;object-fit:contain;border-radius:14px}
.item.in{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.itemname{font-size:clamp(24px,calc(4.6*var(--vh)),38px);font-weight:700;margin-top:8px;text-align:center}
.obtn{width:clamp(150px,18vw,230px);border-radius:32px;padding:14px 10px;font-weight:700;font-size:clamp(28px,3.2vw,44px);box-shadow:0 8px 0 #0002;transition:transform .12s;background:#fff}
.obtn .e{display:block;font-size:clamp(66px,8vw,110px);line-height:1.1}
.obtn:active{transform:translateY(5px);box-shadow:0 3px 0 #0002}
.obtn.right{outline:6px solid var(--green)}.obtn.wrong{animation:no .4s}
.stars{text-align:center;font-size:clamp(24px,calc(4.6*var(--vh)),38px);letter-spacing:3px;min-height:1.3em}
.stars .off{filter:grayscale(1);opacity:.25}
.done{text-align:center;padding:calc(3*var(--vh)) 20px}
.done .trophy{font-size:clamp(90px,calc(20*var(--vh)),170px);animation:bounce 1.2s infinite}
.done h2{font-size:clamp(34px,calc(7*var(--vh)),62px);margin:10px 0;color:var(--purple)}

.confetti{position:fixed;top:-20px;width:12px;height:18px;z-index:40;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(calc(110*var(--vh))) rotate(720deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-height:520px){.top h1{font-size:34px}.pill{padding:6px 14px}}
</style></head><body>
<div class="bubbles" id="bubbles"></div>

<!-- MENU -->

    <button class="mcard" data-go="bag"><div class="ic" style="background:#fff3d6"><img src="../IMAGENES/TOUCH/touch_bag.jpg" alt=""></div><div class="t">Feely Bag</div><div class="d">What's in the bag?</div></button>

  </div>

<!-- HOW DO I FEEL -->
<section id="s-how" class="hidden">
  <div class="storybox">
    <svg id="story" viewBox="0 0 1536 560" aria-label="How we feel things">
      <defs><clipPath id="objClip"><rect x="300" y="285" width="215" height="200" rx="22"/></clipPath>
        <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ecc497"/><stop offset=".8" stop-color="#e3b585"/><stop offset="1" stop-color="#d4a271"/></linearGradient></defs>

        <circle cx="680" cy="125" r="9"/><circle cx="715" cy="102" r="9"/><circle cx="755" cy="118" r="9"/><circle cx="695" cy="160" r="9"/><circle cx="738" cy="150" r="9"/><circle cx="782" cy="150" r="8"/><circle cx="720" cy="188" r="8"/><circle cx="660" cy="155" r="7"/>
      </g>

      </g>
    </svg>
  </div>
  <div class="steptext" id="stepText"></div>

  <div class="btns">

    <button class="big orange hidden" id="stOther">🔁 Another one</button>
  </div>
</section>

<!-- TOUCH CARDS -->
<section id="s-cards" class="hidden">
  <p class="lead">Tap a card. How does it feel? 🤔</p>
  <div class="cards" id="cards"></div>
</section>
<div class="stage hidden" id="stage">

    <div class="hd">How does it feel?</div>

</div>

<!-- FEELY BAG -->
<section id="s-bag" class="hidden">

  </div>
</section>

<!-- OPPOSITES -->
<section id="s-opp" class="hidden">

<script>
/* ============================================================
   EASY TO EDIT
   ============================================================ */
const IMG='../IMAGENES/TOUCH/';
/* Touch Cards (from the flashcards) */
const CARDS=[
  {word:'soft',   img:'soft.jpg',   face:'🧸',fimg:'touch_teddy.png', thing:'a towel'},
  {word:'hard',   img:'hard.jpg',   face:'🪨',fimg:'touch_rock.png', thing:'a walnut'},

  {word:'rough',  img:'rough.jpg',  face:'🌳',fimg:'opp_tree.png', thing:'tree bark'},
  {word:'slimy',  img:'slimy.jpg',  face:'🤢',fimg:'face_slimy.png', thing:'slime'},
  {word:'prickly',img:'prickly.jpg',face:'🌵',fimg:'face_prickly.png', thing:'a cactus'},
  {word:'hot',    img:'hot.jpg',    face:'🥵',fimg:'face_hot.png', thing:'a hot pot'},
  {word:'cold',   img:'cold.jpg',   face:'🥶',fimg:'face_cold.png', thing:'ice'},
];
/* How do I feel? story */
const STORY=[
  {name:'cactus', img:'prickly.jpg', feel:'prickly', bub:'Ouch! Prickly!', away:true},
  {name:'towel',  img:'soft.jpg',    feel:'soft',    bub:'Mmm! Soft!',     away:false},
  {name:'ice',    img:'cold.jpg',    feel:'cold',    bub:'Brrr! Cold!',    away:false},
  {name:'hot pot',img:'hot.jpg',     feel:'hot',     bub:'Ouch! Hot!',     away:true},
  {name:'tree',   img:'rough.jpg',   feel:'rough',   bub:'It’s rough!', away:false},
];
/* Feely Bag */
const BAG=[
  {name:'teddy',    img:'touch_teddy2.png', clue:'It feels soft and fluffy.'},
  {name:'cactus',   img:'prickly.jpg', clue:'It feels prickly. Ouch!'},
  {name:'ice',      img:'cold.jpg', clue:'It feels cold and hard.'},
  {name:'slime',    img:'slimy.jpg', clue:'It feels slimy and wet. Yuck!'},
  {name:'ball',     img:'bag_ball.png', clue:'It feels round and smooth.'},
  {name:'walnut',   img:'hard.jpg', clue:'It feels hard and bumpy.'},
  {name:'feather',  img:'bag_feather.png', clue:'It feels soft and light. It tickles!'},
  {name:'stone',    img:'smooth.jpg', clue:'It feels hard and smooth.'},
  {name:'sponge',   img:'bag_sponge.png', clue:'It feels soft and squishy.'},
  {name:'brick',    img:'bag_brick.png', clue:'It feels hard and rough.'},
];
const BAG_ROUNDS=6;
/* Opposites */
const OPP=[
  {a:['hot','🔥','opp_hot_btn.png'], b:['cold','❄️','opp_cold_btn.png'], items:[
    {name:'sun',img:'opp_sun.png',x:'hot'},{name:'hot pot',img:'hot.jpg',x:'hot'},{name:'fire',img:'opp_hot_btn.png',x:'hot'},{name:'candle',img:'opp_candle.png',x:'hot'},
    {name:'ice',img:'cold.jpg',x:'cold'},{name:'snowman',img:'opp_snowman.jpg',x:'cold'},{name:'ice cream',img:'opp_icecream.jpg',x:'cold'},{name:'ice cube',img:'opp_cold_btn.png',x:'cold'}]},
  {a:['soft','🧸','touch_teddy.png'], b:['hard','🪨','touch_rock.png'], items:[
    {name:'towel',img:'soft.jpg',x:'soft'},{name:'bed',img:'opp_bed.png',x:'soft'},{name:'cat',img:'../SIGHT/room_cat.png',x:'soft'},{name:'feather',img:'bag_feather.png',x:'soft'},
    {name:'walnut',img:'hard.jpg',x:'hard'},{name:'rock',img:'touch_rock.png',x:'hard'},{name:'brick',img:'bag_brick.png',x:'hard'},{name:'hammer',img:'opp_hammer.jpg',x:'hard'}]},
  {a:['smooth','✨','touch_sparkles.png'], b:['rough','🌳','opp_tree.png'], items:[
    {name:'stones',img:'smooth.jpg',x:'smooth'},{name:'apple',img:'../SIGHT/story_apple.png',x:'smooth'},{name:'balloon',img:'../SIGHT/story_balloon.png',x:'smooth'},{name:'egg',img:'opp_egg.jpg',x:'smooth'},
    {name:'tree bark',img:'rough.jpg',x:'rough'},{name:'pineapple',img:'opp_pineapple.jpg',x:'rough'},{name:'crocodile',img:'opp_crocodile.jpg',x:'rough'},{name:'brick',img:'bag_brick.png',x:'rough'}]},
];
const OPP_ROUNDS=9;

/* ============================================================ */
const $=id=>document.getElementById(id);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
let voice=null;
function pickVoice(){try{const v=speechSynthesis.getVoices();voice=v.find(x=>/en-GB/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';if(voice)u.voice=voice;u.rate=.85;u.pitch=1.15;speechSynthesis.speak(u)}catch(e){}}
function hush(){try{speechSynthesis.cancel()}catch(e){}}
function confetti(n=60){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cols=['#ef3d45','#ffd52a','#3488e8','#f28b24','#35b64a','#8d55c7','#ff6fa3'];
  for(let i=0;i<n;i++){const c=document.createElement('div');c.className='confetti';
    c.style.cssText=`left:${Math.random()*100}vw;background:${cols[i%7]};animation-duration:${1.6+Math.random()*1.6}s;animation-delay:${Math.random()*.4}s;border-radius:${Math.random()<.5?'50%':'3px'}`;
    document.body.appendChild(c);setTimeout(()=>c.remove(),3800);}
}
const pic=f=>f.img?`<img src="${IMG+f.img}" alt="${f.name}">`:f.e;
const h=$('title');h.innerHTML=[...h.textContent].map(ch=>ch===' '?'<span class="sp"> </span>':`<span>${ch}</span>`).join('');
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){
  const cols=['#ef3d45','#ffd52a','#3488e8','#f28b24','#35b64a','#8d55c7'],box=$('bubbles');
  for(let i=0;i<12;i++){const b=document.createElement('div');b.className='bubble';const s=30+Math.random()*90;
    b.style.cssText=`left:${Math.random()*100}vw;width:${s}px;height:${s}px;background:${cols[i%6]};animation-duration:${14+Math.random()*16}s;animation-delay:${-Math.random()*25}s`;
    box.appendChild(b);}
}

/* ---------- navigation ---------- */
let current='menu';
function go(name){
  hush();closeStage();
  document.querySelectorAll('section').forEach(s=>s.classList.add('hidden'));
  $('s-'+name).classList.remove('hidden');current=name;
  const back=$('backBtn');
  if(name==='menu'){back.textContent='⬅ 5 Senses';back.href='five_senses.html';}
  else{back.textContent='⬅ Back';back.href='#';}
  if(name==='how')startStory();
  if(name==='bag')startBag();
  if(name==='opp')startOpp();
  scrollTo(0,0);
}
$('backBtn').addEventListener('click',e=>{if(current!=='menu'){e.preventDefault();go('menu');}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)go(b.dataset.go)});

/* ---------- HOW DO I FEEL? ---------- */
const STEPS=[
  {t:'How do I feel things? 🤔', s:"How do I feel things? Let's find out!", c:['far']},
  {t:'1. I touch the {n} with my finger 👆', s:'I touch the {n} with my finger.', c:[]},
  {t:'2. My skin has tiny touch sensors!', s:'My skin has lots of tiny touch sensors. My fingertips have lots and lots!', c:['sensors']},
  {t:'3. The sensors send a message along my nerves… ⚡', s:'The touch sensors send a message. It goes along my nerves, like a telephone wire!', c:['up']},
  {t:'4. …all the way up to my brain 🧠', s:'The message goes all the way up to my brain. Very, very fast!', c:['up']},
  {t:'5. My brain says…', s:'My brain says… {b}', c:['bubOn']},
];
let st=0,sf=0;
$('dots').innerHTML=STEPS.map(()=>'<i></i>').join('');
function startStory(){st=0;showStep();}
function showStep(){
  const f=STORY[sf],S=STEPS[st],last=st===STEPS.length-1;
  let cls=[...S.c];
  $('objImg').setAttribute('href',IMG+f.img);$('objCover').style.display=f.img==='prickly.jpg'?'none':'';
  $('bubText').textContent=f.bub;
  $('stepText').textContent=S.t.replace('{n}',f.name);
  let spoken=S.s.replace('{n}',f.name).replace('{b}',f.bub.replace('’',"'")+` It feels ${f.feel}!`);
  $('story').setAttribute('class',cls.join(' '));
  document.querySelectorAll('#dots i').forEach((d,i)=>d.classList.toggle('on',i<=st));
  $('stBack').disabled=st===0;
  $('stNext').classList.toggle('hidden',last);$('stOther').classList.toggle('hidden',!last);
  say(spoken);
  if(last){confetti(30);
    if(f.away){ // brain sends a message back: move away!
      setTimeout(()=>{if(STEPS[st]!==S||STORY[sf]!==f)return;
        $('story').setAttribute('class','bubOn down bub2On');
        $('stepText').textContent='My brain tells my hand: Move away! 💨';
        say('Then my brain sends a message back to my hand: Move away! Quick!');
      },2600);
    }
  }
}
$('stNext').onclick=()=>{if(st<STEPS.length-1){st++;showStep();}};
$('stBack').onclick=()=>{if(st>0){st--;showStep();}};
$('stOther').onclick=()=>{sf=(sf+1)%STORY.length;st=1;showStep();};

/* ---------- TOUCH CARDS ---------- */
let ci=-1;const seen=new Set();
function drawCards(){$('cards').innerHTML=CARDS.map((c,i)=>`<button class="tcard" data-i="${i}"><div class="hd">How does it feel?</div><div class="im"><img src="${IMG+c.img}" alt=""></div><div class="wd">${seen.has(i)?c.word:'?'}</div></button>`).join('');}
drawCards();
$('cards').addEventListener('click',e=>{const b=e.target.closest('.tcard');if(b)openCard(+b.dataset.i)});
function openCard(i){ci=i;const c=CARDS[i];$('stImg').src=IMG+c.img;$('stWord').innerHTML='?';$('stTell').disabled=false;
  $('stage').classList.remove('hidden');say(`Look! ${cap(c.thing)}. How does it feel?`);}
$('stTell').onclick=()=>{const c=CARDS[ci];$('stWord').innerHTML=`${c.word} <span class="face">${c.fimg?`<img src="${IMG+c.fimg}" alt="">`:c.face}</span>`;$('stTell').disabled=true;
  seen.add(ci);drawCards();confetti(35);say(`It feels ${c.word}!`);};
function closeStage(){if(!$('stage').classList.contains('hidden')){$('stage').classList.add('hidden');hush();}}
$('stPrev').onclick=()=>openCard((ci+CARDS.length-1)%CARDS.length);
$('stNextC').onclick=()=>openCard((ci+1)%CARDS.length);
$('stClose').onclick=closeStage;
$('stage').addEventListener('click',e=>{if(e.target.id==='stage')closeStage()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeStage()});

/* ---------- FEELY BAG ---------- */
let bQueue=[],bRound=0,bScore=0,bCur=null,bLock=false;
function bStars(){$('bStars').innerHTML=Array.from({length:BAG_ROUNDS},(_,i)=>`<span class="${i<bScore?'':'off'}">⭐</span>`).join('')}
function startBag(){bQueue=shuffle(BAG).slice(0,BAG_ROUNDS);bRound=0;bScore=0;$('bDone').classList.add('hidden');$('bPlay').classList.remove('hidden');nextBag();}
function feelBag(){const b=$('bag');b.classList.remove('feel');void b.offsetWidth;b.classList.add('feel');say('I put my hand in the bag. '+bCur.clue+' What is it?');}
function nextBag(){
  bStars();
  if(bRound>=bQueue.length){$('bPlay').classList.add('hidden');$('bDone').classList.remove('hidden');confetti(120);say('Well done! You have super hands!');return;}
  bCur=bQueue[bRound];bLock=false;$('bClue').textContent=bCur.clue;
  const others=shuffle(BAG.filter(x=>x!==bCur)).slice(0,2);
  $('bOpts').innerHTML=shuffle([bCur,...others]).map(o=>`<button class="opt" data-n="${o.name}"><div class="e">${pic(o)}</div><div class="l">${o.name}</div></button>`).join('');
  feelBag();
}
$('bag').onclick=feelBag;
$('bOpts').addEventListener('click',e=>{
  const b=e.target.closest('.opt');if(!b||bLock||b.classList.contains('wrong'))return;
  if(b.dataset.n===bCur.name){bLock=true;b.classList.add('right');bScore++;bStars();confetti(35);
    say(`Yes! It's ${/^[aeiou]/.test(bCur.name)?'an':'a'} ${bCur.name}!`.replace("a slime","slime").replace("an ice","ice"));bRound++;setTimeout(nextBag,2300);}
  else{b.classList.add('wrong');say('Hmm… no. Feel again!');}
});
$('bAgain').onclick=startBag;

/* ---------- OPPOSITES ---------- */
let oQueue=[],oRound=0,oScore=0,oCur=null,oLock=false;
function oStars(){$('oStars').innerHTML=Array.from({length:OPP_ROUNDS},(_,i)=>`<span class="${i<oScore?'':'off'}">⭐</span>`).join('')}
function startOpp(){
  const per=OPP_ROUNDS/OPP.length;let q=[];
  OPP.forEach(p=>{shuffle(p.items).slice(0,per).forEach(it=>q.push({p,it}))});
  oQueue=shuffle(q);oRound=0;oScore=0;$('oDone').classList.add('hidden');$('oPlay').classList.remove('hidden');nextOpp();
}
function nextOpp(){
  oStars();['oA','oB'].forEach(id=>$(id).classList.remove('right','wrong'));
  if(oRound>=oQueue.length){$('oPlay').classList.add('hidden');$('oDone').classList.remove('hidden');confetti(120);say('Well done!');return;}
  oCur=oQueue[oRound];oLock=false;const {p,it}=oCur;
  $('oQ').textContent=`${cap(p.a[0])} or ${p.b[0]}?`;
  $('oA').innerHTML=`<span class="e">${p.a[2]?`<img src="${IMG+p.a[2]}" alt="">`:p.a[1]}</span>${p.a[0]}`;$('oA').dataset.x=p.a[0];
  $('oB').innerHTML=`<span class="e">${p.b[2]?`<img src="${IMG+p.b[2]}" alt="">`:p.b[1]}</span>${p.b[0]}`;$('oB').dataset.x=p.b[0];
  const el=$('oItem');el.innerHTML=pic(it);el.classList.remove('in');void el.offsetWidth;el.classList.add('in');
  $('oName').textContent=it.name;
  say(`${cap(it.name)}. Is it ${p.a[0]} or ${p.b[0]}?`);
}
['oA','oB'].forEach(id=>$(id).onclick=()=>{
  const b=$(id);if(oLock||!oCur)return;b.classList.remove('wrong');void b.offsetWidth;
  if(b.dataset.x===oCur.it.x){oLock=true;b.classList.add('right');oScore++;oStars();confetti(25);
    say(`Yes! It's ${oCur.it.x}!`);oRound++;setTimeout(nextOpp,1900);}
  else{b.classList.add('wrong');say('Hmm… try again!');}
});
$('oAgain').onclick=startOpp;
</script></body></html>
