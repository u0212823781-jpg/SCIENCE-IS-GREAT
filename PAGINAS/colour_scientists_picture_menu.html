<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Colour Scientists Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--red:#ef3d45;--yellow:#ffd52a;--blue:#3488e8;--orange:#f28b24;--green:#35b64a;--purple:#8d55c7;--ink:#202020;--vh:1vh}
@supports(height:1dvh){:root{--vh:1dvh}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:Fredoka,"Arial Rounded MT Bold",Arial,sans-serif;background:#fff;color:var(--ink);-webkit-tap-highlight-color:transparent;user-select:none;overflow:hidden}
button{font-family:inherit;border:0;cursor:pointer;padding:0}
button:focus-visible{outline:5px solid var(--blue);outline-offset:4px}
.page{display:none;height:calc(100*var(--vh));padding:calc(2*var(--vh)) 3vw;text-align:center;align-content:center;justify-items:center}
.active{display:grid}
.wrap{width:100%;max-width:1400px}
h2{font-size:clamp(28px,calc(7*var(--vh)),56px);margin:0 0 calc(1*var(--vh))}
h3{font-size:clamp(20px,calc(4*var(--vh)),32px);margin:0 0 calc(2*var(--vh))}
.row{display:flex;justify-content:center;align-items:flex-start;gap:clamp(12px,2.5vw,34px)}

/* colour dots */
.dot{--s:min(12vw,calc(22*var(--vh)));width:var(--s);height:var(--s);border-radius:50%;box-shadow:0 5px 14px #0002;border:7px solid #fff;transition:transform .15s,opacity .3s}
.dot:active{transform:scale(.92)}
.red{background:var(--red)}.green{background:var(--green)}.blue{background:var(--blue)}.yellow{background:var(--yellow)}.purple{background:var(--purple)}.orange{background:var(--orange)}
.item{display:flex;flex-direction:column;align-items:center;gap:calc(1*var(--vh))}
.name{font-size:clamp(18px,calc(4.2*var(--vh)),30px);font-weight:700;padding:0 6px 2px;border-bottom:6px solid}
.recipe{display:flex;align-items:center;gap:5px;font-size:clamp(18px,calc(4*var(--vh)),26px);font-weight:700;color:#777}
.mini{display:inline-block;width:30px;height:30px;border-radius:50%;box-shadow:0 2px 5px #0003;border:3px solid #fff}
.bounce{animation:bounce .5s}
@keyframes bounce{0%,100%{transform:scale(1)}40%{transform:scale(1.15)}70%{transform:scale(.95)}}

/* meet: two groups side by side */
.groups{display:grid;grid-template-columns:1fr 1fr;gap:3vw;margin-top:calc(3*var(--vh))}
.group{background:#f7f9fb;border-radius:32px;padding:calc(3*var(--vh)) 1.5vw calc(4*var(--vh))}

/* lab: palette | cup | result */
.lab-layout{display:grid;grid-template-columns:auto auto minmax(260px,1fr);gap:5vw;align-items:center;justify-content:center;margin-top:calc(2*var(--vh))}
.palette{display:flex;flex-direction:column;align-items:center;gap:calc(3*var(--vh))}
.palette .dot{--s:min(10vw,calc(19*var(--vh)))}
.palette .dot.used{opacity:.3;transform:scale(.85)}
.cup{width:calc(40*var(--vh));height:calc(56*var(--vh));max-width:26vw;border:9px solid #7f9aa6;border-top:5px solid #7f9aa6;border-radius:12px 12px 42px 42px;position:relative;overflow:hidden;background:#f7fcff}
.layer{position:absolute;left:0;right:0;bottom:0;height:0;transition:height .65s ease,background .65s ease}
.drop{position:absolute;left:50%;top:-40px;width:34px;height:44px;margin-left:-17px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;z-index:3}
.result-col{display:flex;flex-direction:column;align-items:center;gap:calc(4*var(--vh))}
.stirrer{width:calc(18*var(--vh));height:calc(18*var(--vh));border-radius:50%;font-size:calc(10*var(--vh));background:#f4f4f4;box-shadow:0 5px 14px #0002}
.reset{width:calc(12*var(--vh));height:calc(12*var(--vh));border-radius:50%;font-size:calc(6*var(--vh));background:#f4f4f4;box-shadow:0 3px 10px #0002}
.lab-actions{display:flex;justify-content:center;align-items:center;gap:24px}
.equation{display:flex;justify-content:center;align-items:center;gap:10px;min-height:calc(13*var(--vh));font-size:calc(6*var(--vh));font-weight:700;color:#666}
.equation .mini{width:calc(11*var(--vh));height:calc(11*var(--vh));border-width:5px}
.equation.show{animation:bounce .6s}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 5px 14px #0002}50%{box-shadow:0 0 0 12px #3488e833,0 5px 14px #0002;transform:scale(1.06)}}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}

/* game */
.stars{font-size:calc(7*var(--vh));letter-spacing:4px;margin:0 0 calc(1*var(--vh))}
.prompt{display:flex;justify-content:center;align-items:center;gap:16px;min-height:calc(15*var(--vh));font-size:clamp(28px,calc(8*var(--vh)),56px);font-weight:700}
.listen{width:calc(13*var(--vh));height:calc(13*var(--vh));border-radius:50%;font-size:calc(7*var(--vh));background:#f4f4f4;box-shadow:0 4px 12px #0002}
.prompt .mini{width:calc(12*var(--vh));height:calc(12*var(--vh));border-width:5px}
.choices{display:flex;justify-content:center;gap:5vw;margin-top:calc(5*var(--vh))}
.choices .dot{--s:min(18vw,calc(30*var(--vh)))}
.choices .dot.wrong{opacity:.25;pointer-events:none}
.choices .dot.right{animation:bounce .6s;box-shadow:0 0 0 10px #35b64a55}
.big-btn{margin-top:calc(4*var(--vh));padding:calc(2.5*var(--vh)) 34px;border-radius:40px;font-size:calc(5*var(--vh));font-weight:700;background:var(--yellow);box-shadow:0 5px 0 #d4a900,0 8px 18px #0002}
.big-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #d4a900}
.win{font-size:calc(9*var(--vh));font-weight:700;margin:calc(4*var(--vh)) 0 0}

/* home: scene left, menu tiles right */
.home-layout{display:flex;align-items:center;justify-content:center;gap:3vw;height:100%}
.scene{height:calc(92*var(--vh));max-width:62vw;aspect-ratio:1024/1045;object-fit:cover;border-radius:28px;box-shadow:0 10px 28px #0002}
.tiles{display:flex;flex-direction:column;gap:calc(1.8*var(--vh))}
.tile{height:calc(21.5*var(--vh));aspect-ratio:312/282;border-radius:26px;overflow:hidden;box-shadow:0 6px 16px #0003;transition:transform .15s;background:#fff}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile:active{transform:scale(.95)}
.tile.game{background:linear-gradient(#ffe3f1,#ffc7e2);border:5px solid #fff;font-size:calc(12*var(--vh));display:grid;place-items:center}


/* painting: my colour wheel */
.paint-layout{display:flex;align-items:center;justify-content:center;gap:3vw;height:100%;padding-right:6vw}
.flower{height:calc(94*var(--vh));max-width:50vw}
.petal{cursor:pointer;transition:fill .5s}
.petal.done{stroke-dasharray:none;stroke:#222;stroke-opacity:1}
.plabel{font-size:22px;font-weight:700;fill:#333;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:#fff;stroke-width:6px;stroke-linejoin:round}
.paint-side{display:flex;flex-direction:column;align-items:center;gap:calc(3*var(--vh))}
.paint-side h2{margin:0}
.pots{display:grid;grid-template-columns:repeat(3,auto);gap:calc(2*var(--vh)) 2vw;justify-content:center}
.pot{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px}
.pots .dot{--s:min(7.5vw,calc(14*var(--vh)))}
.pots .recipe{cursor:pointer}
.pots .recipe .mini{width:min(2.6vw,calc(5*var(--vh)));height:min(2.6vw,calc(5*var(--vh)))}
.flying{position:fixed;z-index:30;pointer-events:none;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 6px #0003}
.spoon{position:fixed;z-index:31;pointer-events:none;font-size:calc(8*var(--vh))}
.pots .dot.selected{box-shadow:0 0 0 8px #222,0 5px 14px #0003;transform:scale(1.08)}
.pots .dot.locked{background:#fff;border:6px dashed #bdbdbd;box-shadow:none;color:#aaa;font-size:calc(8*var(--vh));font-weight:700;line-height:1}
.petal.hint{animation:petalHint 1s ease-in-out infinite}
@keyframes petalHint{0%,100%{stroke-width:7}50%{stroke-width:16}}
.mission{display:inline-flex;align-items:center;gap:12px;background:#fff8dc;border:4px dashed #f2c200;border-radius:30px;padding:calc(1.2*var(--vh)) 28px;font-size:calc(6*var(--vh));font-weight:700;color:#666}
.mission .mini{width:calc(9*var(--vh));height:calc(9*var(--vh));border-width:4px}
.mission .q{display:inline-grid;place-items:center;width:calc(9*var(--vh));height:calc(9*var(--vh));border-radius:50%;border:4px dashed #bbb;background:#fff;color:#aaa}
.palette .dot.off{opacity:.2;pointer-events:none}
.group-label{grid-column:1/-1;font-size:clamp(18px,calc(3.6*var(--vh)),28px);font-weight:700;margin-top:calc(1*var(--vh))}
.side-actions{display:flex;gap:20px;align-items:center}
.mini-tile{width:calc(15*var(--vh));height:calc(13*var(--vh));border-radius:18px;overflow:hidden;box-shadow:0 4px 12px #0003}
.mini-tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile.paint{background:linear-gradient(#fff4d6,#ffe39a);border:5px solid #fff;font-size:calc(12*var(--vh));display:grid;place-items:center}
.go-paint{width:calc(12*var(--vh));height:calc(12*var(--vh));border-radius:50%;font-size:calc(6*var(--vh));background:#fff4d6;box-shadow:0 3px 10px #0002}

.scene-wrap{position:relative;display:flex}
.scene-wrap .scene{cursor:pointer}
.song-btn{position:absolute;left:calc(2*var(--vh));top:calc(2*var(--vh));width:calc(15*var(--vh));height:calc(15*var(--vh));border-radius:50%;background:#fff;font-size:calc(8*var(--vh));box-shadow:0 6px 18px #0004;display:grid;place-items:center}
.song-btn.playing{animation:beat .9s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
/* fixed buttons */
.site-btn{position:fixed;right:18px;top:18px;z-index:10;display:flex;align-items:center;gap:6px;padding:8px 16px;border-radius:30px;background:#fff;box-shadow:0 4px 14px #0003;font-size:22px;font-weight:700;color:var(--ink);text-decoration:none}
.back-home{position:fixed;right:18px;bottom:18px;width:calc(11*var(--vh));height:calc(10*var(--vh));min-width:64px;min-height:58px;border-radius:18px;overflow:hidden;box-shadow:0 5px 18px #0003;z-index:10;background:#fff}
.back-home img{width:100%;height:100%;object-fit:cover;display:block}
.sound{position:fixed;left:18px;bottom:18px;width:58px;height:58px;border-radius:50%;font-size:28px;background:#fff;box-shadow:0 5px 18px #0003;z-index:10}
.blob{position:fixed;top:-60px;width:40px;height:40px;border-radius:50%;z-index:20;pointer-events:none}

/* portrait screens (tablets/phones held upright): ask to rotate */
.rotate{display:none;position:fixed;inset:0;z-index:50;background:#fff;flex-direction:column;align-items:center;justify-content:center;gap:20px;font-size:32px;font-weight:700;text-align:center;padding:20px}
.rotate .icon{font-size:90px;animation:turn 2s ease-in-out infinite}
@keyframes turn{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (max-aspect-ratio:4/5){.rotate{display:flex}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

<section id="meet" class="page"><div class="wrap">
<h2>Meet our colours!</h2>
<div class="groups">
  <div class="group">
    <h3>Primary colours</h3>
    <div class="row">
      <div class="item"><button class="dot yellow" onclick="meet(this,'yellow')" aria-label="yellow"></button><span class="name" style="border-color:var(--yellow)">yellow</span></div>
      <div class="item"><button class="dot red" onclick="meet(this,'red')" aria-label="red"></button><span class="name" style="border-color:var(--red)">red</span></div>
      <div class="item"><button class="dot blue" onclick="meet(this,'blue')" aria-label="blue"></button><span class="name" style="border-color:var(--blue)">blue</span></div>
    </div>
  </div>
  <div class="group">
    <h3>Secondary colours</h3>
    <div class="row">
      <div class="item"><button class="dot orange" onclick="meet(this,'orange')" aria-label="orange"></button><span class="name" style="border-color:var(--orange)">orange</span><div class="recipe"><i class="mini yellow"></i>+<i class="mini red"></i></div></div>
      <div class="item"><button class="dot green" onclick="meet(this,'green')" aria-label="green"></button><span class="name" style="border-color:var(--green)">green</span><div class="recipe"><i class="mini yellow"></i>+<i class="mini blue"></i></div></div>
      <div class="item"><button class="dot purple" onclick="meet(this,'purple')" aria-label="purple"></button><span class="name" style="border-color:var(--purple)">purple</span><div class="recipe"><i class="mini red"></i>+<i class="mini blue"></i></div></div>
    </div>
  </div>
</div>
</div></section>

const $=id=>document.getElementById(id);
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- sound ---------- */
let soundOn=true,voice=null,actx=null;
function pickVoice(){
  const v=speechSynthesis.getVoices();
  voice=v.find(x=>x.lang==='en-GB')||v.find(x=>x.lang&&x.lang.startsWith('en'))||null;
}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function say(t){
  if(!soundOn||!('speechSynthesis' in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);
  u.lang='en-GB';u.rate=.85;u.pitch=1.15;if(voice)u.voice=voice;
  speechSynthesis.speak(u);
}
function tone(f,d=.15,delay=0){
  if(!soundOn)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime+delay;
    o.type='sine';o.frequency.value=f;
    g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.25,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d+.05);
  }catch(e){}
}
const chime=()=>{tone(660,.18);tone(880,.3,.14)};
const boop=()=>tone(220,.25);
function toggleSound(){
  soundOn=!soundOn;$('soundBtn').textContent=soundOn?'🔊':'🔇';
  if(!soundOn){if('speechSynthesis' in window)speechSynthesis.cancel();$('song').pause();}
}
function replay(el,cls){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);}
function splash(){
  if(reduceMotion)return;
  for(let i=0;i<26;i++){
    const b=document.createElement('div');b.className='blob';
    const s=20+Math.random()*34;
    b.style.cssText=`left:${Math.random()*100}vw;width:${s}px;height:${s}px;background:${HEX[rnd(COLOURS)]}`;
    document.body.appendChild(b);
    b.animate([{transform:'translateY(0)'},{transform:`translateY(${innerHeight+120}px) rotate(${Math.random()*360}deg)`}],
      {duration:1400+Math.random()*1200,delay:Math.random()*300,easing:'ease-in'}).onfinish=()=>b.remove();
  }
}


/* ---------- song ---------- */
function toggleSong(){
  const s=$('song');
  if(s.paused){if('speechSynthesis' in window)speechSynthesis.cancel();s.play().catch(()=>{});}
  else s.pause();
}
function songUI(){
  const s=$('song'),b=$('songBtn'),on=!s.paused;
  b.textContent=on?'⏸️':'▶️';b.classList.toggle('playing',on);b.classList.toggle('pulse',!on);
}
['play','pause','ended'].forEach(ev=>$('song').addEventListener(ev,songUI));

/* ---------- navigation ---------- */
function go(x){
  document.querySelectorAll('.page').forEach(e=>e.classList.remove('active'));
  $(x).classList.add('active');scrollTo(0,0);
  $('backHome').hidden=(x==='home');
  $('siteBtn').hidden=(x!=='home');
  if(x!=='home')$('song').pause();
  if(x==='meet')say('Meet our colours! Touch a colour.');
  if(x!=='lab')mission=null;
  if(x==='lab'){resetLab();
    if(mission){const [a,b]=RECIPE[mission];
      $('mission').innerHTML=`<i class="mini ${a}"></i>+<i class="mini ${b}"></i>=<span class="q">?</span>`;$('mission').hidden=false;
      say(`Let's make ${mission}! Mix ${a} and ${b}.`);}
    else{$('mission').hidden=true;say('Welcome to the lab! Choose two colours.');}}
  if(x==='game')startGame();
  if(x==='paint'){updatePots();
    if(pendingBrush){selectBrush(pendingBrush);say(`Paint the ${pendingBrush} petal!`);pendingBrush=null;}
    else{paintHints();say(brush?'Paint the flower!':'Choose a colour and paint the flower!');}}
}

/* ---------- meet the colours ---------- */
function meet(el,c){
  replay(el,'bounce');
  if(RECIPE[c])say(`${RECIPE[c][0]} and ${RECIPE[c][1]} make ${c}!`);
  else say(c);
}

/* ---------- lab ---------- */
let pours=[],mixed=false;
function pour(c,btn){
  if(mixed||pours.includes(c)){replay($('cup'),'shake');return;}
  if(pours.length>=2){replay($('cup'),'shake');say('Now stir!');return;}
  if(mission&&!RECIPE[mission].includes(c)){replay(btn,'shake');say(`Use ${RECIPE[mission][0]} and ${RECIPE[mission][1]}!`);return;}
  pours.push(c);btn.classList.add('used');say(c);tone(500,.12);
  const n=pours.length,cup=$('cup'),l=$('layer'+n);
  const fill=()=>{l.style.background=HEX[c];l.style.bottom=n===1?'0':'50%';l.style.height='50%';};
  if(reduceMotion){fill();}else{
    const d=document.createElement('div');d.className='drop';d.style.background=HEX[c];cup.appendChild(d);
    d.animate([{top:'-40px'},{top:n===1?'75%':'30%'}],{duration:450,easing:'ease-in'}).onfinish=()=>{d.remove();fill();};
  }
  hints();
}
function stirColours(){
  if(mixed)return;
  if(pours.length!==2){replay($('stir'),'shake');say('Choose two colours!');return;}
  const [a,b]=pours,result=MIX[[a,b].sort().join('+')];
  $('stir').animate([{transform:'rotate(-25deg)'},{transform:'rotate(25deg)'},{transform:'rotate(-25deg)'},{transform:'rotate(25deg)'},{transform:'rotate(0)'}],{duration:900});
  mixed=true;hints();
  const isNew=!unlocked.has(result);if(mission===result){pendingBrush=result;}unlocked.add(result);updatePots();$('goPaint').hidden=false;if(isNew)$('goPaint').classList.add('pulse');
  setTimeout(()=>{
    const l1=$('layer1');l1.style.bottom='0';l1.style.height='100%';l1.style.background=HEX[result];$('layer2').style.height='0';
    const eq=$('equation');
    eq.innerHTML=`<i class="mini ${a}"></i>+<i class="mini ${b}"></i>=<i class="mini ${result}"></i>`;
    replay(eq,'show');chime();splash();
    say(`${a} and ${b} make ${result}!`+(mission===result?' Now let\'s paint!':(isNew?` Now you can paint with ${result}!`:'')));
    if(mission===result){$('mission').querySelector('.q').outerHTML=`<i class="mini ${result}"></i>`;mission=null;}
  },650);
}
function resetLab(){
  pours=[];mixed=false;
  ['layer1','layer2'].forEach(id=>{const e=$(id);e.style.height='0';e.style.bottom='0';});
  $('equation').innerHTML='';
  document.querySelectorAll('.palette .dot').forEach(d=>d.classList.remove('used'));
  hints();
}
function hints(){
  document.querySelectorAll('#lab .pulse').forEach(e=>e.classList.remove('pulse'));
  if(mixed)($('goPaint').hidden?$('reset'):$('goPaint')).classList.add('pulse');
  else if(pours.length===2)$('stir').classList.add('pulse');
  else document.querySelectorAll('.palette .dot:not(.used)').forEach(d=>{
    const off=mission&&!RECIPE[mission].includes(d.getAttribute('aria-label'));
    d.classList.toggle('off',!!off);if(!off)d.classList.add('pulse');});
}


/* ---------- painting: my colour wheel ---------- */
const unlocked=new Set(['yellow','red','blue']);
let brush=null,mission=null,pendingBrush=null;
function updatePots(){
  document.querySelectorAll('.pots .dot').forEach(d=>{
    const c=d.dataset.c,locked=!unlocked.has(c);
    d.classList.toggle('locked',locked);
    d.textContent=locked?'?':'';
  });
}
function pickPaint(btn){
  const c=btn.dataset.c;
  if(!unlocked.has(c)){mixHere(c);return;}
  brush=c;
  document.querySelectorAll('.pots .dot').forEach(d=>d.classList.toggle('selected',d===btn));
  tone(520,.1);say(c);paintHints();
}
function paintPetal(p){
  if(p.classList.contains('done'))return;
  const target=p.dataset.c;
  if(!brush){say('Choose a colour first!');document.querySelectorAll('.pots .dot:not(.locked)').forEach(d=>replay(d,'bounce'));return;}
  if(brush!==target){replay(p,'shake');boop();say('Try another petal!');return;}
  p.setAttribute('fill',HEX[target]);p.classList.add('done');chime();paintHints();
  say(`${target}! ${RECIPE[target]?'Secondary':'Primary'} colour!`);
  if(document.querySelectorAll('.petal.done').length===6)setTimeout(()=>{
    replay($('face'),'bounce');splash();say('Well done! Your colour wheel is ready!');
  },1300);
}
function paintHints(){
  document.querySelectorAll('#paint .pulse,.petal.hint').forEach(e=>e.classList.remove('pulse','hint'));
  const undone=c=>document.querySelector(`.petal[data-c="${c}"]:not(.done)`);
  if(brush&&undone(brush))document.querySelectorAll(`.petal[data-c="${brush}"]:not(.done)`).forEach(p=>p.classList.add('hint'));
  else document.querySelectorAll('.pots .dot').forEach(d=>{if(undone(d.dataset.c))d.classList.add('pulse');});
}
let mixing=false;
function mixHere(c){
  if(mixing)return;
  if(unlocked.has(c)){selectBrush(c);say(c);return;}
  mixing=true;
  const pot=document.querySelector(`.pots .dot[data-c="${c}"]`),minis=pot.parentElement.querySelectorAll('.recipe .mini');
  const t=pot.getBoundingClientRect(),tx=t.left+t.width/2,ty=t.top+t.height/2;
  const [a,b]=RECIPE[c];
  pot.textContent='';pot.classList.remove('pulse');
  minis.forEach((m,i)=>{
    const r=m.getBoundingClientRect(),f=document.createElement('div');f.className='flying';
    f.style.cssText=`left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;background:${HEX[i?b:a]}`;
    document.body.appendChild(f);
    setTimeout(()=>{tone(i?600:480,.12);say(i?b:a);
      f.animate([{transform:'translate(0,0) scale(1)'},{transform:`translate(${tx-r.left-r.width/2}px,${ty-r.top-r.height/2}px) scale(1.8)`,opacity:.9}],
        {duration:600,easing:'ease-in',fill:'forwards'}).onfinish=()=>{
          f.remove();
          pot.style.background=`linear-gradient(90deg,${HEX[a]} 50%,${HEX[b]} 50%)`;pot.style.borderStyle='solid';};
    },i*900);
  });
  setTimeout(()=>{
    const s=document.createElement('div');s.className='spoon';s.textContent='🥄';
    s.style.left=(tx-20)+'px';s.style.top=(ty-60)+'px';document.body.appendChild(s);
    s.animate([{transform:'rotate(-30deg)'},{transform:'rotate(30deg)'},{transform:'rotate(-30deg)'},{transform:'rotate(30deg)'},{transform:'rotate(0)'}],{duration:900}).onfinish=()=>{
      s.remove();pot.style.background='';pot.style.borderStyle='';
      unlocked.add(c);updatePots();replay(pot,'bounce');chime();splash();
      say(`${a} and ${b} make ${c}!`);selectBrush(c);mixing=false;
    };
  },2000);
}
function selectBrush(c){
  brush=c;document.querySelectorAll('.pots .dot').forEach(d=>d.classList.toggle('selected',d.dataset.c===c));paintHints();
}
function resetPaint(){
  ['orange','green','purple'].forEach(c=>unlocked.delete(c));updatePots();
  document.querySelectorAll('.petal').forEach(p=>{p.setAttribute('fill','#fff');p.classList.remove('done');});
  brush=null;document.querySelectorAll('.pots .dot').forEach(d=>d.classList.remove('selected'));paintHints();
}

/* ---------- game ---------- */
const TOTAL=6;let round=0,busy=false,current=null,lastTarget=null;
function startGame(){
  round=0;$('gameEnd').hidden=true;$('gameArea').hidden=false;drawStars();nextQ();
}
function drawStars(){$('stars').textContent='⭐'.repeat(round)+'☆'.repeat(TOTAL-round);}
function nextQ(){
  busy=false;
  if(round>=TOTAL)return endGame();
  const p=$('prompt'),ch=$('choices');let options;
  if(round%2===0){
    let t;do{t=rnd(COLOURS)}while(t===lastTarget);lastTarget=t;
    options=shuffle([t,...shuffle(COLOURS.filter(c=>c!==t)).slice(0,2)]);
    current={answer:t,speech:`Find ${t}!`};
    p.innerHTML=`<button class="listen" onclick="say(current.speech)" aria-label="listen again">🔊</button><span>Find ${t}!</span>`;
  }else{
    const r=rnd(Object.keys(RECIPE)),[a,b]=RECIPE[r];
    options=shuffle(['orange','green','purple']);
    current={answer:r,speech:`${a} and ${b} make...?`};
    p.innerHTML=`<button class="listen" onclick="say(current.speech)" aria-label="listen again">🔊</button><i class="mini ${a}"></i>+<i class="mini ${b}"></i>=<span>?</span>`;
  }
  ch.innerHTML='';
  options.forEach(c=>{
    const d=document.createElement('button');d.className='dot '+c;d.setAttribute('aria-label',c);
    d.onclick=()=>answer(c,d);ch.appendChild(d);
  });
  say(current.speech);
}
function answer(c,btn){
  if(busy)return;
  if(c===current.answer){
    busy=true;btn.classList.add('right');chime();
    say(rnd(['Well done!','Great job!','Brilliant!','Yes! '+c+'!']));
    round++;drawStars();setTimeout(nextQ,1600);
  }else{
    btn.classList.add('wrong');replay(btn,'shake');boop();say('Try again!');
  }
}
function endGame(){
  $('gameArea').hidden=true;$('gameEnd').hidden=false;
  splash();chime();say('Fantastic! You are a colour scientist!');
}
</script></body></html>
