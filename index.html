<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Science is Great!</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--red:#ef3d45;--yellow:#ffd52a;--blue:#3488e8;--orange:#f28b24;--green:#35b64a;--purple:#8d55c7;--ink:#202020;--vh:1vh}
@supports(height:1dvh){:root{--vh:1dvh}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:Fredoka,"Arial Rounded MT Bold",Arial,sans-serif;color:var(--ink);background:#f3faff;-webkit-tap-highlight-color:transparent;user-select:none;overflow-x:hidden}
.bubbles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bubble{position:absolute;bottom:-120px;border-radius:50%;opacity:.18;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(calc(-120*var(--vh) - 200px))}}
header{position:relative;z-index:1;text-align:center;padding:calc(4*var(--vh)) 20px calc(2*var(--vh))}
h1{margin:0;font-size:clamp(44px,calc(11*var(--vh)),96px);line-height:1;letter-spacing:1px}
h1 span{display:inline-block;-webkit-text-stroke:3px #fff;paint-order:stroke;text-shadow:0 5px 0 #0001}
h1 span:nth-child(6n+1){color:var(--red)}h1 span:nth-child(6n+2){color:var(--orange)}h1 span:nth-child(6n+3){color:var(--yellow)}
h1 span:nth-child(6n+4){color:var(--green)}h1 span:nth-child(6n+5){color:var(--blue)}h1 span:nth-child(6n+6){color:var(--purple)}
h1 .sp{width:.35em}
.sub{margin:calc(1.5*var(--vh)) 0 0;font-size:clamp(20px,calc(4*var(--vh)),30px);color:#557}
main{position:relative;z-index:1;display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(18px,3vw,40px);padding:calc(3*var(--vh)) 4vw calc(6*var(--vh))}
.card{width:clamp(220px,26vw,340px);background:#fff;border-radius:30px;box-shadow:0 8px 24px #0002;overflow:hidden;text-decoration:none;color:inherit;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s;border:6px solid #fff}
.card:hover{transform:translateY(-6px) rotate(-1deg);box-shadow:0 14px 30px #0003}
.card:active{transform:scale(.97)}
.card:focus-visible{outline:5px solid var(--blue);outline-offset:4px}
.card .pic{aspect-ratio:1;border-radius:24px;overflow:hidden;display:grid;place-items:center;font-size:clamp(70px,9vw,120px)}
.card .pic img{width:100%;height:100%;object-fit:cover;display:block}
.card .title{font-size:clamp(22px,2.4vw,32px);font-weight:700;padding:14px 10px 4px;text-align:center}
.card .desc{font-size:clamp(15px,1.4vw,19px);color:#667;text-align:center;padding:0 12px 18px}
.card.soon{pointer-events:none;opacity:.55}
.card.soon .pic{background:repeating-linear-gradient(45deg,#eef3f7 0 18px,#e4ebf1 18px 36px)}
.badge{display:inline-block;margin-top:6px;padding:4px 14px;border-radius:20px;background:#ffe9a8;font-size:15px;font-weight:700;color:#8a6a00}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="bubbles" id="bubbles"></div>
<header>
  <h1 id="title">Science is Great!</h1>
  <p class="sub">Choose an adventure 🔬</p>
</header>
<main id="cards"></main>

/* colourful title, letter by letter */
const h=document.getElementById('title');
h.innerHTML=[...h.textContent].map(ch=>ch===' '?'<span class="sp"> </span>':`<span>${ch}</span>`).join('');

/* cards */
document.getElementById('cards').innerHTML=ACTIVITIES.map(a=>`
  <a class="card${a.soon?' soon':''}" ${a.soon?'aria-disabled="true"':`href="${a.link}"`}>
    <div class="pic" style="background:${a.bg||'#fff'}">${a.img?`<img src="${a.img}" alt="">`:(a.icon||'🔬')}</div>
    <div class="title">${a.title}</div>
    <div class="desc">${a.desc}${a.soon?'<br><span class="badge">Coming soon</span>':''}</div>
  </a>`).join('');

/* floating paint bubbles */
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){
  const cols=['#ef3d45','#ffd52a','#3488e8','#f28b24','#35b64a','#8d55c7'],box=document.getElementById('bubbles');
  for(let i=0;i<14;i++){const b=document.createElement('div');b.className='bubble';const s=30+Math.random()*90;
    b.style.cssText=`left:${Math.random()*100}vw;width:${s}px;height:${s}px;background:${cols[i%6]};animation-duration:${14+Math.random()*16}s;animation-delay:${-Math.random()*25}s`;
    box.appendChild(b);}
}
